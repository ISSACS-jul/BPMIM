name: Release BPMIM (Linux & Windows)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Node dependencies
        run: npm install

      - name: Build AppImage
        run: npx tauri build --bundles appimage

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: BPMIM-Linux-AppImage-v0.3.5
          path: src-tauri/target/release/bundle/appimage/*.AppImage

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node dependencies
        run: npm install

      - name: Build Windows Executable
        run: npx tauri build

      - name: Upload Windows Portable Binary (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: BPMIM-Windows-Portable-v0.3.5
          path: src-tauri/target/release/bpmim.exe

      - name: Upload Windows Setup Installer (.exe)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BPMIM-Windows-Setup-v0.3.5
          path: src-tauri/target/release/bundle/nsis/*.exe
