name: Release BPMIM (Linux & Windows)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux (AppImage)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Node dependencies
        run: npm install

      - name: Build AppImage
        run: npx tauri build --bundles appimage

      - name: Prepare Linux AppImage
        run: |
          mkdir -p dist-release
          cp src-tauri/target/release/bundle/appimage/*.AppImage dist-release/BPMIM.AppImage
          chmod +x dist-release/BPMIM.AppImage

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: BPMIM-Linux-AppImage
          path: dist-release/BPMIM.AppImage

  build-windows:
    name: Build Windows (Portable .exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node dependencies
        run: npm install

      - name: Build Windows Portable Executable
        run: npx tauri build --no-bundle

      - name: Prepare Windows Portable (.exe)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-release
          Copy-Item src-tauri/target/release/bpmim.exe -Destination dist-release/BPMIM.exe

      - name: Upload Windows Portable Binary (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: BPMIM-Windows-Portable
          path: dist-release/BPMIM.exe

  release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: BPMIM-Linux-AppImage
          path: artifacts

      - name: Download Windows Portable (.exe)
        uses: actions/download-artifact@v4
        with:
          name: BPMIM-Windows-Portable
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/BPMIM.AppImage
            artifacts/BPMIM.exe
          generate_release_notes: true
